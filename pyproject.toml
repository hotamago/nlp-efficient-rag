[project]
name = "effrag"
version = "0.1.0"
description = "Efficient RAG: benchmark efficient retrieval and context compression for LLM question answering (IT4772 NLP course project)"
readme = "README.md"
authors = [
    { name = "Nguyễn Hoàng Sơn" },
    { name = "Võ Việt Hoàng" },
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.4",
    "transformers>=4.51,<5",
    "sentence-transformers>=3.0",
    "llmlingua>=0.2.2",
    "bm25s>=0.2",
    "PyStemmer>=2.2",
    "faiss-cpu>=1.8",
    "openai>=1.40",
    "tiktoken>=0.7",
    "numpy",
    "pandas",
    "tqdm",
    "python-dotenv>=1.0",
    "nltk>=3.8",
    "peft>=0.21.2",
    "bitsandbytes>=0.50.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "ipykernel",
    "python-pptx>=1.0.2",
    "pymupdf>=1.28.2",
]
demo = ["gradio>=4.40"]
viz = ["matplotlib>=3.8", "seaborn>=0.13"]

[tool.uv]
default-groups = ["dev", "demo", "viz"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
